name: Build Android APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug -x lint -x test --stacktrace 2>&1 | tee ../gradle.log
        continue-on-error: true

      - name: Publish Gradle Log to Step Summary
        if: always()
        run: |
          echo "### Gradle Build Log Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if grep -q "FAILURE:" gradle.log; then
            grep -B 5 -A 40 "FAILURE:" gradle.log >> $GITHUB_STEP_SUMMARY
          else
            tail -n 60 gradle.log >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-full-log
          path: gradle.log
          retention-days: 7

      - name: Verify APK Generated
        run: |
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: app-debug.apk was not generated!"
            exit 1
          fi
          echo "SUCCESS: APK file verified at android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Push Error Log to Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          cp gradle.log debug-log.txt
          git add debug-log.txt
          git commit -m "ci: gradle debug log"
          git push -u origin debug-log --force

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABSENKU-PKL-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

